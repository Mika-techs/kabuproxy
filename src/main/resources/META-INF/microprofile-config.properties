# Defaults. Every key can be overridden by an env var: upper-case, dots -> underscores
# (e.g. kabu.crawl.interval.minutes -> KABU_CRAWL_INTERVAL_MINUTES).
# Unset on purpose (no default): kabu.cred.key, kabu.oidc.provider.uri, kabu.oidc.client.id, kabu.oidc.client.secret, kabu.public.url

kabu.dev.auth=false

kabu.oidc.admin.group=kabuproxy-admin

kabu.crawl.enabled=true
kabu.crawl.interval.minutes=30
kabu.crawl.active.from=06:00
kabu.crawl.active.to=22:00
kabu.crawl.request.delay.millis=400
kabu.refresh.cooldown.minutes=5
kabu.digikabu.base.url=https://digikabu.de
